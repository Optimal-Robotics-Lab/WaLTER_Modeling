# Full-scale WaLTER hardware model.
#
# Status of the values below:
#   - Leg visual meshes and leg joint positions (knee, axles): estimated from the CAD
#     meshes in assets/meshes/visual; values marked GUESS still need confirmation.
#   - Torso visual meshes, the waist, and the hip positions: taken from the body
#     meshes. Each mesh origin lies on the waist axis (mesh +z forward, mesh +y up,
#     mesh +x to the left). The hip joints are the centers of the embossed side pads.
#   - Torso collision primitives and the explicit inertials: PLACEHOLDERS from
#     parametric/configs/FS. The long segment is the front torso. Payloads mount
#     on that segment, and the forward mass helps the robot pitch over obstacles.
#
# Units: meters, kilograms, kg*m^2, degrees, N*m. Quaternions are (w, x, y, z).
# Every body frame sits at the joint that connects it to its parent, so `pos` is
# that joint's location in the parent body's frame.
# Leg values are given for the left legs; right legs are mirrored across the xz-plane.
#
# Geometry per body:
#   mass:     link mass in kg. Used when HardwareModel is built with
#             inertia_from_visual=True (the default). MuJoCo spreads it uniformly
#             through the visual geom (exact mesh volume, or the convex hull if
#             the mesh is not a closed solid). Bodies without a vis mesh use the
#             visual copy of their collision primitives.
#   inertial: explicit mass properties. Used when inertia_from_visual=False;
#             geoms do not contribute mass in that mode.
#   col:      list of contact primitives; type is box | capsule | cylinder | sphere | ellipsoid | mesh
#             (mesh entries name a file in assets/meshes/collision/ without the .obj extension)
#   vis:      optional CAD mesh; omit it to render copies of the contact primitives instead
#     mesh:       file in assets/meshes/visual/ without the .obj extension (left-side part)
#     mesh_right: optional separately modeled right-side part; otherwise the left mesh is mirrored
#     pos, quat:  pose of the mesh's own frame in the body frame

start_pos: [0, 0, 0.5]

# Short segment. Frame at mid-length, on the waist axis. The mesh origin is the
# waist, so it sits on the +x face, half a length (0.164942 m) forward of the frame.
# Quaternion (w, x, y, z) = (0.5, 0.5, 0.5, 0.5) is a 120 deg rotation about
# (1, 1, 1): mesh +z -> body +x, mesh +x -> body +y, mesh +y -> body +z.
back_torso:
  mass: 18.79 #kg
  inertial: {pos: [0, 0, 0], mass: 18.0, diaginertia: [0.1186, 0.1836, 0.2050]}
  col:
    - {type: box, size: [0.15, 0.15, 0.09], pos: [0, 0, 0]}
  vis:
    mesh: rearbody_vis_mesh
    pos: [0.164942, 0, 0]
    quat: [0.5, 0.5, 0.5, 0.5]

# Long segment. Frame at the waist, which is this mesh's origin. The two waist
# pilots are both centered on that origin, so the segments meet with no added gap.
# Same mesh-to-body rotation as the rear segment.
front_torso:
  mass: 25.91 #kg
  pos: [0.164942, 0, 0]
  inertial: {pos: [0.23, 0, 0], mass: 36.0, diaginertia: [0.2372, 0.7320, 0.7748]}
  col:
    - {type: box, size: [0.23, 0.15, 0.09], pos: [0.23, 0, 0]}
  vis:
    mesh: frontbody_vis_mesh
    pos: [0, 0, 0]
    quat: [0.5, 0.5, 0.5, 0.5]

thigh:
  # Hip joints are the centers of the embossed side pads, on the outer face
  # (mesh x = ±0.150114 m, 5.91 in). Left-leg positions; right legs are mirrored.
  # Rear pad: 1.67 mm aft of the segment center and 0.127 mm (0.005 in) below
  # the waist axis. Front pad: 0.366624 m forward of the waist, at waist height.
  mass: 5.25
  pos_back: [-0.001670, 0.150114, -0.000127]
  pos_front: [0.366624, 0.150114, 0]
  inertial: {pos: [0, 0.04, -0.09], mass: 3.375, diaginertia: [0.01046, 0.01046, 0.0027]}
  # Inboard of the wheels. The cylinder runs from the hip (z = 0) to z = -0.08;
  # each end cap adds the 0.03 m radius. The wheels sit beside the knee and
  # sweep up into the thigh as the knee flexes. A capsule continued to the knee
  # starts inside both wheel cylinders, and that contact is stiff enough to
  # cancel knee torque.
  col:
    - {type: capsule, size: [0.03, 0.0904875], pos: [0, 0.03, -0.08]}
  # Mesh frame: link along y, hip shaft and knee axis along z.
  # Hip shaft: radius 0.03, free end at z=-0.054448, shoulder at z=-0.024448,
  # centered on the mesh origin. The free end plugs into the torso.
  # The motor housing at +y stands above that shaft. The knee is the other end:
  # a pad centered at (0, -0.180975), outboard face z=0.018225, radius 0.046355,
  # which matches the shin bore.
  # Shaft +z points outboard so the free end points inboard, +y points up, and
  # the knee points down: 180 deg about (0, 1, 1)/sqrt(2). pos centers the shaft
  # on the hip joint.
  vis:
    mesh: thigh_vis_mesh
    pos: [0, 0.00, 0]
    quat: [0, 0, 0.7071068, 0.7071068]

shin:
  # Knee pad center, on its outboard face, expressed in the thigh body frame.
  mass: 5.76 #kg
  pos: [0, 0.057673, -0.180975]
  inertial: {pos: [0, 0, 0], mass: 1.2, diaginertia: [0.00096, 0.005146, 0.005146]}
  col:
    - {type: capsule, size: [0.03, 0.108], pos: [0, 0.03, 0], quat: [0.7071068, 0, 0.7071068, 0]}
  # Mesh frame: knee hole at the origin, axles along mesh x, plate spans mesh y 0 to 0.047.
  vis:
    mesh: shin_vis_mesh
    pos: [0, 0, 0]
    quat: [1, 0, 0, 0]

wheel:
  mass: 1.59 #kg
  # Axles at the centers of the shin's rounded ends; wheels mount on the shin's outer face.
  pos_axle1: [0.1137, 0.0471, 0]
  pos_axle2: [-0.1137, 0.0471, 0]
  inertial: {pos: [0, 0, 0], mass: 2.25, diaginertia: [0.0075, 0.01125, 0.0075]}
  col:
    # Radius, then half-width along the axle. ellipsoid repeats the radius on
    # both rolling axes; cylinder uses these two numbers directly.
    - type: ellipsoid
      size: [0.11, 0.05]
      pos: [0, 0.04, 0]
      quat: [0.7071068, 0.7071068, 0, 0]
      friction: [1, 0.005, 0.0001]
      solref: [-80800, -112]
  # Mesh frame: spin axis along mesh z. The z = 0 face has the axle bore and mounts
  # against the shin; the closed hub face at z = 0.078 faces outboard.
  # Rotation of -90 deg about x maps mesh z -> body +y (outboard).
  # UVs in the mesh sample assets/textures/wheel.png: tread on the rounded
  # outside, gray metal only in the outboard hub recess.
  # Rebuild with scripts/make_wheel_texture.py.
  vis:
    mesh: wheel_vis_mesh
    pos: [0, 0, 0]
    quat: [0.7071068, -0.7071068, 0, 0]

# damping is viscous, N*m/(rad/s). frictionloss is dry Coulomb friction, N*m,
# and does not depend on joint speed. MuJoCo applies it as a force constraint,
# so the torque bound stays well-defined at zero velocity. 0 is no dry friction.
# One entry covers every joint of that type (four hips, four knees, eight axles).
joints:
  waist: {axis: [1, 0, 0], range: [-25, 25], stiffness: 10, damping: 1, frictionloss: 0.0}
  hip: {axis: [0, 1, 0], damping: 2, frictionloss: 15.84}
  knee: {axis: [0, 1, 0], damping: 2, frictionloss: 7.71}
  axle: {axis: [0, 1, 0], damping: 2, frictionloss: 0.8}

# Joint armature = rotor_inertia * gear_ratio^2.
# stall_torque is motor-side; the actuator's joint torque limit is stall_torque * gear_ratio.
motors:
  hip: {gear_ratio: 160, stall_torque: 1.8, rotor_inertia: 0.0002}
  knee: {gear_ratio: 120, stall_torque: 1.8, rotor_inertia: 0.0002}
  axle: {gear_ratio: 30, stall_torque: 1.8, rotor_inertia: 0.0002}
