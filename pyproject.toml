[build-system]
requires = ["uv_build >= 0.12.10, <0.13.0"]
build-backend = "uv_build"

[project]
name = "WaLTER_Modeling"
version = "0.1.0"
description = "Model generation scripts for WaLTER morphology"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Matthew Gomez", email = "matthewgomezm10@gmail.com"}
]
dependencies = [
    "absl-py",
    "mujoco>=3.2.3",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
viz = [
    "matplotlib",
    "pygame",
    "PyQt6",
    "scipy",
]

[project.scripts]
generate-walter = "WaLTER_Modeling:main"

[tool.uv.build-backend]
module-name = "WaLTER_Modeling"
module-root = ""
